<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Návrh mapy v průběhu | Před koupí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styl.css?v=13">
<link rel="stylesheet" href="/proverit/proverit.css?v=11">
<link rel="stylesheet" href="/objednavka/stav.css?v=6">
<style>
  .volba { display: flex; gap: 8px; margin: 0 0 22px; flex-wrap: wrap; }
  .volba button { font: 700 .82rem Montserrat, sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: 10px 16px; min-height: 44px;
    background: transparent; color: var(--text-t); border: 1px solid rgba(255,255,255,.4); cursor: pointer; }
  .volba button[aria-pressed="true"] { background: #fff; color: var(--navy); border-color: #fff; }
  .popis-varianty { color: var(--tlumene-t); max-width: 70ch; margin: -8px 0 22px; }
  /* Varianta B: oddálený snímek a malá mapa Prahy v rohu */
  .vlozka { position: absolute; top: 12px; right: 12px; width: 32%; min-width: 120px; max-width: 170px; padding: 8px 8px 6px;
    background: rgba(14,20,40,.78); border: 1px solid rgba(255,255,255,.25); }
  .vlozka svg { display: block; position: static; inset: auto; width: 100%; height: auto; }
  .vlozka span { display: block; margin-top: 4px; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-align: center; }
  /* Varianta C: pod snímkem mapa Prahy s městskou částí */
  .kde-praha { background: var(--karta-t); border: 1px solid var(--linka-t); padding: 16px 18px; margin-top: 18px; }
  .kde-praha h3 { margin: 0 0 4px; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--slabe-t); }
  .kde-praha p { margin: 0 0 10px; font-weight: 700; }
  .kde-praha svg { display: block; width: 100%; height: auto; max-height: 260px; }
  .pr-levy { display: grid; align-content: start; }
  .tecka-pulz { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: no-preference) { .tecka-pulz { animation: pulz 1.8s ease-out infinite; } }
  @keyframes pulz { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(3); } }
</style>
<script src="mapa/data.js"></script>
</head>
<body class="stranka-proverit">
<div class="pruh-test" style="background:#f0a050;color:#1e2645;font:600 12px/1.7 Montserrat,Arial,sans-serif;text-align:center;padding:3px 16px">Návrh – jen na testu, ke schválení</div>
<header class="hlavicka"><div class="obal lista"><a class="logo" href="/"><b>PŘED KOUPÍ</b><span>prověření bytu a domu</span></a></div></header>
<main class="obal">
  <div class="zahlavi">
    <span class="stitek">Návrh obrazovky průběhu</span>
    <h1>Kde v Praze dům je</h1>
  </div>
  <div class="volba" role="group" aria-label="Varianta">
    <button type="button" data-v="b" aria-pressed="true">Varianta B</button>
    <button type="button" data-v="c" aria-pressed="false">Varianta C</button>
  </div>
  <p class="popis-varianty" id="popis"></p>
  <section id="objednavka"></section>
</main>
<script>
(() => {
  const M = window.MAPA;
  const mapka = (detail) => `<svg viewBox="-6 -6 ${M.w + 12} ${M.h + 12}" role="img" aria-label="Poloha domu v Praze">
    ${detail ? M.mc.map((m) => `<path d="${m.d}" fill="${m.nazev === M.mcDomu ? "rgba(255,255,255,.28)" : "rgba(255,255,255,.04)"}" stroke="rgba(255,255,255,${m.nazev === M.mcDomu ? ".9" : ".25"})" stroke-width="${m.nazev === M.mcDomu ? 1.6 : .7}"/>`).join("") : ""}
    <path d="${M.obec}" fill="${detail ? "none" : "rgba(255,255,255,.12)"}" stroke="#fff" stroke-width="${detail ? 1.6 : 2.2}"/>
    <circle class="tecka-pulz" cx="${M.dum[0]}" cy="${M.dum[1]}" r="${detail ? 5 : 8}" fill="#fff"/>
    <circle cx="${M.dum[0]}" cy="${M.dum[1]}" r="${detail ? 5 : 8}" fill="#fff" stroke="#1e2645" stroke-width="${detail ? 2.5 : 3.5}"/></svg>`;
  const kroky = `<div class="pr-hlavni">
      <div class="pr-ukazatel"><span class="pr-procenta">38 %</span><span class="pr-cas">zbývá asi 6 min</span><div class="pr-pruh"><i style="width:38%"></i></div></div>
      <ol class="pr-kroky">
        <li class="hotovo"><span class="pr-ikona"></span><div><b>Platba</b></div></li>
        <li class="hotovo"><span class="pr-ikona"></span><div><b>Katastr a identifikace</b></div></li>
        <li class="aktivni"><span class="pr-ikona"></span><div><b>Povodně, hluk, radon a územní plán</b><ul class="pr-zpravy"><li class="ok">Měříme vzdálenost ke stoleté vodě a povodni 2002</li><li class="bezi">Čteme hlukovou mapu u nejhlučnější fasády</li></ul></div></li>
        <li><span class="pr-ikona"></span><div><b>Právní stav a záměry v okolí</b></div></li>
        <li><span class="pr-ikona"></span><div><b>Odhad ceny z prodejů v katastru</b></div></li>
        <li><span class="pr-ikona"></span><div><b>Report</b></div></li>
        <li><span class="pr-ikona"></span><div><b>Kontrola kvality</b></div></li>
      </ol>
      <p class="pr-odejit">Stránku můžete zavřít – report pošleme e-mailem a uvidíte ho i tady. Zpravidla do 10 minut.</p></div>`;
  const VARIANTY = {
    b: { popis: "Oddálený letecký snímek (okolí asi 700 × 500 m) a v rohu malá mapa Prahy s tečkou. Bez dalšího místa na stránce.",
      html: `<div class="pr"><figure class="pr-snimek"><img src="mapa/okoli.jpg" alt="Letecký snímek okolí domu">
        <div class="vlozka">${mapka(false)}<span>Praha</span></div>
        <figcaption>Prověřujeme <b>${M.adresa}</b></figcaption></figure>${kroky}</div>` },
    c: { popis: "Detail domu jako dnes a pod ním mapa Prahy s městskými částmi; městská část domu je zvýrazněná. Zaplní prázdné místo vlevo pod snímkem.",
      html: `<div class="pr"><div class="pr-levy"><figure class="pr-snimek"><img src="mapa/detail.jpg" alt="Letecký snímek domu">
        <figcaption>Prověřujeme <b>${M.adresa}</b></figcaption></figure>
        <div class="kde-praha"><h3>Kde v Praze</h3><p>${M.mcDomu} – Krč</p>${mapka(true)}</div></div>${kroky}</div>` },
  };
  const ukaz = (v) => {
    document.getElementById("objednavka").innerHTML = VARIANTY[v].html;
    document.getElementById("popis").textContent = VARIANTY[v].popis;
    document.querySelectorAll(".volba button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  };
  document.querySelectorAll(".volba button").forEach((b) => b.addEventListener("click", () => ukaz(b.dataset.v)));
  ukaz(new URLSearchParams(location.search).get("v") === "c" ? "c" : "b");
})();
</script>
</body>
</html>
